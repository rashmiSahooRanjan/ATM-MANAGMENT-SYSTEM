<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Page Not Found – ATM System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0a0e1a; font-family:'Outfit',sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; color:white; }
        .err-wrap { text-align:center; }
        .err-num { font-size:10rem; font-weight:800; background:linear-gradient(135deg,#1a237e,#7c83fd); -webkit-background-clip:text; -webkit-text-fill-color:transparent; line-height:1; }
        .err-icon { font-size:3rem; color:#7c83fd; margin:1rem 0; }
        h2 { font-size:2rem; font-weight:700; margin-bottom:0.5rem; }
        p { color:#8892b0; margin-bottom:2rem; }
        .btn-home { display:inline-flex; align-items:center; gap:0.5rem; background:linear-gradient(135deg,#1a237e,#7c83fd); color:white; padding:0.8rem 2rem; border-radius:50px; text-decoration:none; font-weight:600; transition:transform 0.2s; }
        .btn-home:hover { transform:scale(1.05); color:white; }
    </style>
</head>
<body>
<div class="err-wrap">
    <div class="err-num">{% if error %}500{% else %}404{% endif %}</div>
    <div class="err-icon"><i class="fas fa-{% if error %}server{% else %}map-signs{% endif %}"></i></div>
    <h2>{% if error %}{{ error }}{% else %}Page Not Found{% endif %}</h2>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/" class="btn-home"><i class="fas fa-home"></i> Go Home</a>
</div>
</body>
</html>
