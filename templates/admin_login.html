<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin Login – ATM Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body class="auth-body">
<div class="auth-bg">
    <div class="orb orb1" style="background:radial-gradient(circle,rgba(124,83,253,0.4),transparent)"></div>
    <div class="orb orb2" style="background:radial-gradient(circle,rgba(245,87,108,0.3),transparent)"></div>
</div>

<div class="auth-container auth-single">
    <div class="auth-card admin-card">
        <div class="admin-login-icon">
            <i class="fas fa-shield-halved"></i>
        </div>
        <div class="auth-card-header">
            <h3>Admin Access</h3>
            <p>Restricted – Authorized Personnel Only</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="auth-alert auth-alert-{{ category }}">
                    <i class="fas {% if category=='success' %}fa-check-circle{% else %}fa-exclamation-circle{% endif %}"></i>
                    {{ message }}
                </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('admin_login') }}" novalidate>
            <div class="form-group-custom">
                <label>Admin Username</label>
                <div class="input-icon-wrap">
                    <i class="fas fa-user-shield"></i>
                    <input type="text" name="username" class="input-custom" placeholder="Enter admin username" required autofocus/>
                </div>
            </div>
            <div class="form-group-custom">
                <label>Password</label>
                <div class="input-icon-wrap">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" id="adminPass" class="input-custom" placeholder="Enter admin password" required/>
                    <button type="button" class="input-eye" onclick="togglePass('adminPass','adminEye')"><i class="fas fa-eye" id="adminEye"></i></button>
                </div>
            </div>
            <div class="admin-hint">
                <i class="fas fa-info-circle"></i>
                Default: admin / Admin@1234 (change in .env)
            </div>
            <button type="submit" class="btn-auth-submit" style="background:linear-gradient(135deg,#7c53fd,#a855f7)">
                <i class="fas fa-unlock-alt"></i> Admin Login
            </button>
        </form>

        <div class="auth-footer-link">
            <a href="{{ url_for('login') }}"><i class="fas fa-arrow-left"></i> Back to User Login</a>
        </div>
    </div>
</div>

<script>
function togglePass(id, iconId) {
    const inp = document.getElementById(id);
    const icon = document.getElementById(iconId);
    if (inp.type === 'password') { inp.type = 'text'; icon.className = 'fas fa-eye-slash'; }
    else { inp.type = 'password'; icon.className = 'fas fa-eye'; }
}
</script>
</body>
</html>
